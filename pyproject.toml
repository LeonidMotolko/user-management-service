[project]
name = "user-management-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "seachran", email = "motolko.leonid.1980@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
user-management-service = "user_management_service:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.1",
    "ty>=0.0.68",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["."]
